name: Mealie
version: "1.0.0"
slug: mealie
description: Self-hosted recipe manager, meal planner, and shopping list
url: https://github.com/mealie-recipes/mealie
arch:
  - aarch64
  - amd64
startup: application
boot: auto
ports:
  9000/tcp: 9925
ports_description:
  9000/tcp: Mealie web interface
environment:
  DB_ENGINE: sqlite
  ALLOW_SIGNUP: "false"
  TZ: America/New_York
  PUID: "1000"
  PGID: "1000"
  BASE_URL: http://homeassistant.local:9925
